# PROD - deployed from `vYYYY.MM.DD[-hotfix.N]` behind the `production`
# GitHub environment approval gate.
# Targets the GCP Kyma cluster (shoot a35836f, stage).
replicaCount: 2
image:
  repository: btp-gcp-test-backend-prod
apirule:
  host: demoapp-backend.a35836f.stage.kyma.ondemand.com
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Used only by the e2e (scripts/runTest.sh), not by the chart: the frontend that calls
# this backend. Its /api/greeting must return this backend's version.
consumer:
  frontendUrl: https://demoapp.a35836f.stage.kyma.ondemand.com
